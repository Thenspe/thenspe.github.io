<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
    <meta name="description" content="A character sheet for the TTRPG 'Worlds Without Number' ">
    <link rel="stylesheet" href="styleCharSheet.css" />
    <title>Blank Character Sheet</title>
</head>
<body>
<main>
<form>
    <fieldset>
        <legend>Character info</legend>
        <input type="text" id="pname" name="pname" placeholder="Player Name">
        <input type="text" id="cname" name="cname" placeholder="Character Name:">
        <input list="class" placeholder="Class">
        <datalist id="class">
            <option value="Expert">
            <option value="Warrior">
            <option value="Mage">
            <option value="Adventurer">
        </datalist>
    </fieldset>
    <fieldset>
        <legend>Attributes</legend>
        <label for="str">Str:</label>
        <input type="number" id="str" name="str" placeholder="10">
        <label for="str">Dex:</label>
        <input type="number" id="dex" name="dex" placeholder="10">
        <label for="str">Con:</label>
        <input type="number" id="con" name="con" placeholder="10">
        <label for="str">Wis:</label>
        <input type="number" id="wis" name="wis" placeholder="10">
        <label for="str">Int:</label>
        <input type="number" id="int" name="int" placeholder="10">
        <label for="str">Cha:</label>
        <input type="number" id="cha" name="cha" placeholder="10">
    </fieldset>
</form>
</main>
</body>
</html>
